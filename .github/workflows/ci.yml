name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, formatação e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unitários com cobertura mínima de 80% de linhas em src/api, src/hooks e src/utils
      # (falha abaixo disso) e o teste de fumaça que renderiza todas as telas.
      - run: npm run test:cobertura
      - run: npm run test:smoke

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Mesmo comando do deploy no Render; roda em Linux, então pega import com maiúscula errada.
      - run: npm run build
        env:
          VITE_API_URL: https://app-segurado-api.onrender.com/api/v1
